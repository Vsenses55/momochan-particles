<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>希望 · 愛 — Cat Particle Study</title>
<meta name="description" content="An interactive particle study: ink drawings of a cat, each paired with a kanji for what she's feeling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"WordFace";font-weight:100 900;src:local("Kozuka Gothic Pr6N H"),local("KozGoPr6N-Heavy"),local("Kozuka Gothic Pr6N B"),local("KozGoPr6N-Bold"),local("Kozuka Gothic Pr6N");}
  :root{
    --bg:#f3efe7; --fg:#1d1b18; --muted:#8a8378; --line:rgba(29,27,24,.14); --chip:rgba(255,255,255,.55); --accent:#b4471f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);transition:background .5s,color .5s}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .title{position:fixed;top:28px;left:32px;pointer-events:none;max-width:320px}
  .title h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:44px;line-height:.95;margin:0;letter-spacing:-.01em}
  .title h1 em{color:var(--accent)}
  .title p{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 0;line-height:1.7}
  .panel{position:fixed;left:32px;bottom:28px;display:flex;flex-direction:column;gap:14px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .label{color:var(--muted);width:64px}
  button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);padding:7px 11px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
  button:hover{border-color:var(--fg)}
  button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  button kbd{font:inherit;opacity:.5;margin-left:6px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:1px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--fg);cursor:pointer}
  .stat{position:fixed;right:32px;bottom:28px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:right;line-height:1.7;pointer-events:none}
  .nav{position:fixed;top:28px;right:32px;display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .nav{flex-wrap:wrap;justify-content:flex-end}
  .nav .prog{flex-basis:100%;height:1px;background:var(--line);margin-top:4px;overflow:hidden}
  .nav .prog i{display:block;height:100%;background:var(--fg);transform-origin:left;transform:scaleX(0)}
  .nav #idx{color:var(--fg);min-width:52px;text-align:center}
  .nav .reading{color:var(--muted);margin-right:10px;text-transform:none;letter-spacing:.04em}
  .nav button{width:34px;height:34px;padding:0;font-size:14px;display:grid;place-items:center}
  .hint-touch{display:none} @media (hover:none){.hint-fine{display:none}.hint-touch{display:inline}}
  .val{color:var(--muted);min-width:42px}
  .loading{position:fixed;inset:0;display:grid;place-items:center;font-family:"Instrument Serif",serif;font-style:italic;font-size:28px;color:var(--muted);pointer-events:none;transition:opacity .6s}
  @media (max-width:700px){
    .title{top:18px;left:18px}.title h1{font-size:32px}.title p{display:none}
    .panel{left:14px;right:14px;bottom:14px;gap:10px}.label{width:auto;margin-right:4px}
    .nav{top:14px;right:14px} .stat{right:auto;left:14px;bottom:auto;top:62px} input[type=range]{width:110px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">gathering ink…</div>

<div class="panel">
  <div class="row"><span class="label">Force</span>
    <button data-mode="repel" class="on">Repel<kbd>1</kbd></button>
    <button data-mode="vortex">Vortex<kbd>2</kbd></button>
    <button data-mode="gravity">Gravity<kbd>3</kbd></button>
    <button data-mode="wind">Wind<kbd>4</kbd></button>
  </div>
  <div class="row"><span class="label">Radius</span><input id="radius" type="range" min="40" max="320" value="130"></div>
  <div class="row"><span class="label">Strength</span><input id="strength" type="range" min="1" max="100" value="45"></div>
  <div class="row"><span class="label">Density</span><input id="density" type="range" min="25" max="250" step="5" value="100"><span class="val" id="densityVal">100%</span></div>
  <div class="row"><span class="label">Do</span>
    <button id="scatter">Scatter<kbd>space</kbd></button>
  </div>
</div>

<div class="nav">
  <span class="reading" id="reading"></span>
  <button id="prev" aria-label="Previous">←</button>
  <span id="idx">01 / 02</span>
  <button id="next" aria-label="Next">→</button>
  <span class="prog"><i id="prog"></i></span>
</div>
<div class="stat" id="stat"><span class="hint-fine">rest your cursor on her</span><span class="hint-touch">hold a finger on her</span></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // ---------- the series ----------
  const scenes = [
    { src: 'assets/cat-01.jpg', glyphs: ['希', '望'], reading: 'kibō · hope', gamma: 0.85, density: 1,   glyphSize: 0.27, glyphY: 0.5, glyphNudge: 0.075,
      eyes: [{ u: .48, v: .276, rx: .05, ry: .032, tilt: 15 }, { u: .685, v: .315, rx: .05, ry: .03 }],
      ears: [{ pu: .44, pv: .215, tu: .44, tv: .035, w: .085 }, { pu: .745, pv: .25, tu: .925, tv: .135, w: .075 }],
      // her pendant swings from the collar ring
      sway: [{ pu: .503, pv: .462, tu: .5, tv: .575, w: .06, taper: 0, curl: 0.5, amp: 0.2, speed: 1.9 }] },
    { src: 'assets/cat-02.jpg', glyphs: ['愛'],       reading: 'ai · love',  gamma: 1.5,  density: 1.7, glyphSize: 0.36, glyphY: 0.4,
      eyes: [{ u: .558, v: .428, rx: .042, ry: .025, tilt: 18 }, { u: .722, v: .464, rx: .044, ry: .023 }],
      ears: [{ pu: .56, pv: .335, tu: .535, tv: .235, w: .065 }, { pu: .79, pv: .41, tu: .935, tv: .335, w: .07 }],
      // a slow, lazy tail wag that bends more toward the tip
      sway: [{ pu: .72, pv: .19, tu: .95, tv: .02, w: .1, taper: 0.15, curl: 2.2, amp: 0.15, speed: 1.35, wag: true }] },
  ];
  scenes.forEach(sc => { sc.im = new Image(); sc.im.src = sc.src; });
  let cur = 0, img = scenes[0].im;

  // ---------- state ----------
  let W = 0, H = 0, scale = 1;              // device pixel buffer size
  let N = 0;
  let px, py, vx, vy, hx, hy, ink, phase, k, isWord; // particle arrays
  // cute layer: which feature a particle belongs to (1–2 eyes, 3–4 ears) + how much it moves
  let part, partW;
  let feat = { eyes: [], ears: [], sway: [] }, catGrid = null, gridCell = 1, gridW = 0;
  let purr = 0, stillT = 0, faceT = 0, blinkT = -1, blinkCool = 0;
  const earState = [{ t: 9, a: 0, cool: 0 }, { t: 9, a: 0, cool: 0 }];
  const hearts = []; let heartClock = 0;
  let imageData, buf32, buf8;
  let mode = 'repel';
  let radius = 130, strength = 45, densityMul = 1;
  let springGain = 1;                         // ramps after scatter
  const pointer = { x: -9999, y: -9999, px: -9999, py: -9999, vx: 0, vy: 0, active: false, down: false };
  let t = 0, last = performance.now(), fps = 60;

  const PAPER = [243, 239, 231];

  // ---------- build particles from image ----------
  function build(snap) {
    const cssW = innerWidth, cssH = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    scale = Math.min(dpr, Math.sqrt(3.2e6 / (cssW * cssH)));
    W = Math.max(1, Math.floor(cssW * scale));
    H = Math.max(1, Math.floor(cssH * scale));
    canvas.width = W; canvas.height = H;
    imageData = ctx.createImageData(W, H);
    buf8 = imageData.data;
    buf32 = new Uint32Array(buf8.buffer);

    // Fit cat: tall on desktop, offset right of the UI; centered on mobile
    const ar = img.width / img.height;
    const narrow = cssW < 700;
    const KW = 0.3;                       // kanji column width as a share of cat height
    let dh, dw, ox, oy;
    if (narrow) {
      // phone: cat + kanji side by side, sitting above the controls
      const availH = H - 240 * scale - 24 * scale;
      dh = Math.min(availH * 0.95, (W * 0.94) / (ar + KW));
      dw = dh * ar;
      ox = (W - (dw + dh * KW)) / 2 + dh * KW;
      oy = 24 * scale + (availH - dh) / 2;
    } else {
      dh = H * 0.9; dw = dh * ar;
      if (dw > W * 0.92) { dw = W * 0.92; dh = dw / ar; }
      ox = Math.max((W - dw) / 2, W * 0.5 - dw * 0.42);
      oy = (H - dh) / 2;
    }

    // sample at device resolution
    const sw = Math.round(dw), sh = Math.round(dh);
    const off = document.createElement('canvas');
    off.width = sw; off.height = sh;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.drawImage(img, 0, 0, sw, sh);
    const src = octx.getImageData(0, 0, sw, sh).data;

    // weight = darkness^gamma; choose density to hit a target count
    const target = Math.round(Math.min(150000, Math.max(36000, (W * H) / 24 * scenes[cur].density)) * densityMul);
    const weights = new Float32Array(sw * sh);
    let sum = 0;
    for (let i = 0, j = 0; i < weights.length; i++, j += 4) {
      const lum = (src[j] * 0.299 + src[j + 1] * 0.587 + src[j + 2] * 0.114) / 255;
      let d = Math.max(0, (0.93 - lum) / 0.93);   // paper → 0
      d = Math.pow(d, scenes[cur].gamma);
      weights[i] = d; sum += d;
    }
    const prob = Math.min(5, target / sum);
    const tx = [], ty = [], ti = [];
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const w = weights[y * sw + x];
        if (w > 0.02) {
          // dark fur can take more than one particle per pixel
          const want = w * prob; let n = want | 0; if (Math.random() < want - n) n++;
          for (let q = 0; q < n; q++) {
            tx.push(ox + x + Math.random() - 0.5);
            ty.push(oy + y + Math.random() - 0.5);
            ti.push(w);
          }
        }
      }
    }
    let catCount = tx.length;

    // ---- the word, set over her in the same ink ----
    const glyphs = scenes[cur].glyphs;
    const fam = '"WordFace", "Kozuka Gothic Pr6N", "Noto Sans JP", sans-serif';
    const tc = document.createElement('canvas'); tc.width = W; tc.height = H;
    const tctx = tc.getContext('2d', { willReadFrequently: true });
    // set vertically (tategaki), two tall glyphs crossing her left flank
    const fs = Math.min(dh * scenes[cur].glyphSize, W * 0.25 * (narrow ? 1.3 : 1));
    tctx.font = `900 ${fs}px ${fam}`;
    tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
    let cy = oy + dh * scenes[cur].glyphY;
    const drawGlyphs = (x) => {
      tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H);
      const step = fs * 0.98, top = cy - step * (glyphs.length - 1) / 2;
      glyphs.forEach((g, n) => tctx.fillText(g, x, top + n * step));
    };
    // ---- layout: snug the kanji to her, then center the pair as one unit ----
    const gap = dh * 0.03;                       // same breathing room for every drawing
    const run = Math.max(6, Math.round(7 * scale));
    const cx0 = fs * 0.6;
    drawGlyphs(cx0);
    const g = tctx.getImageData(0, 0, W, H).data;
    let gL = W, gT = H, gB = 0, minGap = Infinity;
    for (let y = 0; y < H; y++) {
      let gl = -1, gr = -1;
      for (let x = 0; x < W; x++) if (g[(y * W + x) * 4 + 3] > 40) { gl = x; break; }
      if (gl < 0) continue;
      for (let x = W - 1; x >= gl; x--) if (g[(y * W + x) * 4 + 3] > 40) { gr = x; break; }
      gL = Math.min(gL, gl); gT = Math.min(gT, y); gB = y;
      const iy = Math.round(y - oy);
      if (iy < 0 || iy >= sh) continue;
      // her body edge = first solid run of fur; any outline (paws, tail) must also stay clear
      let cnt = 0;
      for (let ix = 0; ix < sw; ix++) {
        if (weights[iy * sw + ix] > 0.14) { if (++cnt >= run) { minGap = Math.min(minGap, ox + ix - run + 1 - gr); break; } }
        else cnt = Math.max(0, cnt - 1);
      }
    }
    let cx = cx0 + (minGap < Infinity ? minGap - gap : 0) + (scenes[cur].glyphNudge || 0) * dh;
    gL += cx - cx0;

    // her ink bounds (ignoring stray specks)
    const colN = new Uint16Array(sw), rowN = new Uint16Array(sh);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) if (weights[y * sw + x] > 0.15) { colN[x]++; rowN[y]++; }
    let cR = 0, cT = 0, cB = sh - 1;
    for (let x = sw - 1; x >= 0; x--) if (colN[x] > 3) { cR = x; break; }
    for (let y = 0; y < sh; y++) if (rowN[y] > 3) { cT = y; break; }
    for (let y = sh - 1; y >= 0; y--) if (rowN[y] > 3) { cB = y; break; }
    const left = gL, right = ox + cR;
    const top = Math.min(gT, oy + cT), bottom = Math.max(gB, oy + cB);

    // center within the free area (phones: between the nav and the controls)
    const areaT = narrow ? 64 * scale : 0, areaB = narrow ? H - 250 * scale : H;
    const ddx = W / 2 - (left + right) / 2;
    const ddy = (areaT + areaB) / 2 - (top + bottom) / 2;
    for (let i = 0; i < catCount; i++) { tx[i] += ddx; ty[i] += ddy; }
    ox += ddx; oy += ddy; cx += ddx; cy += ddy;
    drawGlyphs(cx);
    const td = tctx.getImageData(0, 0, W, H).data;

    // the kanji clears its own space: faint wisps (tail tips) that would touch it are trimmed,
    // with an irregular margin so the edge still looks hand-drawn
    {
      const hit = (x, y) => { x |= 0; y |= 0; return x >= 0 && y >= 0 && x < W && y < H && td[(y * W + x) * 4 + 3] > 40; };
      const nx = [], ny = [], ni = [];
      for (let i = 0; i < catCount; i++) {
        const x = tx[i], y = ty[i], m = gap * (0.45 + Math.random() * 0.55);
        if (hit(x, y) || hit(x - m, y) || hit(x - m * 0.7, y - m * 0.7) || hit(x - m * 0.7, y + m * 0.7) || hit(x, y - m) || hit(x, y + m)) continue;
        nx.push(x); ny.push(y); ni.push(ti[i]);
      }
      tx.length = ty.length = ti.length = nx.length;
      for (let i = 0; i < nx.length; i++) { tx[i] = nx[i]; ty[i] = ny[i]; ti[i] = ni[i]; }
      catCount = tx.length;
    }
    let area = 0;
    for (let j = 3; j < td.length; j += 16) if (td[j] > 128) area++;
    area *= 4;
    const tp = Math.min(1, (target / scenes[cur].density * 0.3) / Math.max(1, area));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const al = td[(y * W + x) * 4 + 3] / 255;
      // occlusion: the word thins out behind her fur so she sits in front of it
      const ix = Math.round(x - ox), iy = Math.round(y - oy);
      const occ = (ix >= 0 && iy >= 0 && ix < sw && iy < sh) ? Math.min(1, weights[iy * sw + ix] * 1.6) : 0;
      if (al > 0.3 && Math.random() < tp * al * (1 - occ * 0.82)) {
        tx.push(x + Math.random() - 0.5); ty.push(y + Math.random() - 0.5); ti.push(0.75);
      }
    }

    const prevN = N, opx = px, opy = py;
    N = tx.length;
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    // order particles top→bottom with a loose, noisy key, so a morph maps
    // "same rough height" to "same rough height" with no hard seams
    const order = new Uint32Array(N), key = new Float32Array(N);
    for (let i = 0; i < N; i++) { order[i] = i; key[i] = ty[i] + (Math.random() - 0.5) * H * 0.22; }
    order.sort((a, b) => key[a] - key[b]);
    hx = new Float32Array(N); hy = new Float32Array(N); ink = new Float32Array(N); isWord = new Uint8Array(N);
    for (let n = 0; n < N; n++) {
      const o = order[n];
      hx[n] = tx[o]; hy[n] = ty[o]; ink[n] = ti[o]; isWord[n] = o >= catCount ? 1 : 0;
    }
    tagFeatures(ox, oy, dw, dh);
    phase = new Float32Array(N); k = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      phase[i] = Math.random() * Math.PI * 2;
      k[i] = 0.018 + Math.random() * 0.03;     // per-particle spring → organic reform
      if (snap) { px[i] = hx[i] + (Math.random() - 0.5) * 3; py[i] = hy[i] + (Math.random() - 0.5) * 3; }
      else if (prevN) {
        // each new particle peels off the matching place in the previous image
        // (proportional mapping, so a change in count never leaves a band behind)
        const j = Math.min(prevN - 1, Math.floor((i + Math.random()) * prevN / N));
        px[i] = opx[j] + (Math.random() - 0.5) * 4; py[i] = opy[j] + (Math.random() - 0.5) * 4;
        vx[i] = (Math.random() - 0.5) * scale; vy[i] = (Math.random() - 0.5) * scale;
      } else {
        // intro: drift in from a loose cloud
        const a = Math.random() * Math.PI * 2, r = (0.35 + Math.random() * 0.8) * Math.max(W, H) * 0.6;
        px[i] = W / 2 + Math.cos(a) * r; py[i] = H / 2 + Math.sin(a) * r;
      }
    }
    if (!prevN) springGain = 0.08;
      }

  // ---------- cute layer: eyes, ears, where her body is ----------
  function tagFeatures(ox, oy, dw, dh) {
    const sc = scenes[cur];
    part = new Uint8Array(N); partW = new Float32Array(N);
    feat.eyes = sc.eyes.map(e => { const a = (e.tilt || 0) * Math.PI / 180; return { x: ox + e.u * dw, y: oy + e.v * dh, rx: e.rx * dw, ry: e.ry * dh, nx: -Math.sin(a), ny: Math.cos(a) }; });
    feat.ears = sc.ears.map(e => {
      const pxv = ox + e.pu * dw, pyv = oy + e.pv * dh, txv = ox + e.tu * dw, tyv = oy + e.tv * dh;
      const len = Math.hypot(txv - pxv, tyv - pyv);
      return { px: pxv, py: pyv, ax: (txv - pxv) / len, ay: (tyv - pyv) / len, len, w: e.w * dw };
    });
    feat.sway = (sc.sway || []).map(e => {
      const pxv = ox + e.pu * dw, pyv = oy + e.pv * dh, txv = ox + e.tu * dw, tyv = oy + e.tv * dh;
      const len = Math.hypot(txv - pxv, tyv - pyv);
      return { ...e, px: pxv, py: pyv, ax: (txv - pxv) / len, ay: (tyv - pyv) / len, len, w: e.w * dw };
    });
    gridCell = Math.max(8, Math.round(14 * scale)); gridW = Math.ceil(W / gridCell);
    catGrid = new Uint16Array(gridW * Math.ceil(H / gridCell));
    for (let i = 0; i < N; i++) {
      if (isWord[i]) continue;
      const x = hx[i], y = hy[i];
      const gi = ((y / gridCell) | 0) * gridW + ((x / gridCell) | 0);
      if (gi >= 0 && gi < catGrid.length) catGrid[gi]++;
      // eyes (a little beyond the eye so the lid fur comes along)
      for (let e = 0; e < feat.eyes.length; e++) {
        const E = feat.eyes[e], nx = (x - E.x) / (E.rx * 1.35), ny = (y - E.y) / (E.ry * 1.6), d = nx * nx + ny * ny;
        if (d < 1) { part[i] = 1 + e; partW[i] = 1 - d; }
      }
      // ears: along the base→tip axis, narrowing toward the tip; the base stays put
      for (let e = 0; e < feat.ears.length; e++) {
        const A = feat.ears[e], dx = x - A.px, dy = y - A.py;
        const along = (dx * A.ax + dy * A.ay) / A.len, across = Math.abs(dx * A.ay - dy * A.ax);
        if (along > -0.05 && along < 1.15 && across < A.w * (1.15 - along * 0.6)) {
          part[i] = 3 + e; partW[i] = Math.min(1, Math.max(0, (along + 0.05) / 0.6)) ** 1.5;
        }
      }
      // swaying parts (pendant, tail): rotate about the pivot, more toward the tip
      for (let e = 0; e < feat.sway.length; e++) {
        const A = feat.sway[e], dx = x - A.px, dy = y - A.py;
        const along = (dx * A.ax + dy * A.ay) / A.len, across = Math.abs(dx * A.ay - dy * A.ax);
        const half = A.w * (1 - Math.max(0, along) * A.taper);
        if (along > -0.04 && along < 1.12 && across < half * 1.15) {
          const edge = Math.min(1, (half * 1.15 - across) / (half * 0.25));   // soft sides, no tearing
          part[i] = 5 + e; partW[i] = Math.min(1, Math.max(0, along + 0.04)) ** A.curl * edge;
        }
      }
    }
    purr = 0; stillT = 0; faceT = 0; blinkT = -1; blinkCool = 1.5 + Math.random() * 2; hearts.length = 0;
  }
  function onCat(x, y) {
    if (!catGrid) return false;
    const gi = ((y / gridCell) | 0) * gridW + ((x / gridCell) | 0);
    return gi >= 0 && gi < catGrid.length && catGrid[gi] > 6;
  }
  function blinkAmount() {               // slow blink: close 0.45s, hold 0.35s, open 0.6s
    if (blinkT < 0) return 0;
    const c = 0.45, h = 0.35, o = 0.6, e = (u) => u * u * (3 - 2 * u);
    if (blinkT < c) return e(blinkT / c);
    if (blinkT < c + h) return 1;
    if (blinkT < c + h + o) return 1 - e((blinkT - c - h) / o);
    return 0;
  }
  function spawnHeart(x, y) {
    const size = (11 + Math.random() * 7) * scale, pts = [];
    const n = Math.round(size * size * 1.6);
    while (pts.length < n * 2) {        // fill a heart shape: (x²+y²−1)³ − x²y³ < 0
      const u = (Math.random() * 2 - 1) * 1.2, v = (Math.random() * 2 - 1) * 1.2;
      const q = u * u + v * v - 1;
      if (q * q * q - u * u * v * v * v < 0) pts.push(u * size, -v * size);
    }
    hearts.push({ x, y, vx: (Math.random() - 0.5) * 12 * scale, life: 0, max: 2.2 + Math.random() * 0.6, ph: Math.random() * 6, pts });
  }
  function updateCute(dt) {
    const sp = Math.hypot(pointer.vx, pointer.vy);
    const over = pointer.active && onCat(pointer.x, pointer.y);
    // purr: rest on her and she settles, hums, and hearts drift up
    stillT = over && sp < 2.2 * scale ? stillT + dt : Math.max(0, stillT - dt * 4);
    const target = Math.min(1, Math.max(0, (stillT - 0.3) / 0.6));
    purr += (target - purr) * Math.min(1, dt * (target > purr ? 4 : 6));
    if (false) {
      heartClock -= dt;
      if (heartClock <= 0) {
        spawnHeart(pointer.x + (Math.random() - 0.5) * 50 * scale, pointer.y - (14 + Math.random() * 18) * scale);
        heartClock = 0.38 + Math.random() * 0.35;
      }
    }
    for (let h = hearts.length - 1; h >= 0; h--) {
      const H_ = hearts[h]; H_.life += dt;
      H_.y -= (32 + H_.life * 12) * scale * dt;
      H_.x += (H_.vx + Math.sin(H_.life * 3 + H_.ph) * 14 * scale) * dt;
      if (H_.life > H_.max) hearts.splice(h, 1);
    }
    // slow blink: linger on her face
    const E0 = feat.eyes[0], E1 = feat.eyes[1];
    if (E0 && E1 && pointer.active) {
      const fx = (E0.x + E1.x) / 2, fy = (E0.y + E1.y) / 2, fr = Math.hypot(E1.x - E0.x, E1.y - E0.y) * 1.25;
      const onFace = Math.hypot(pointer.x - fx, pointer.y - fy) < fr;
      faceT = onFace ? faceT + dt : 0;
    } else faceT = 0;
    blinkCool -= dt;
    if (blinkT < 0 && blinkCool <= 0) { blinkT = 0; blinkCool = 3.5 + Math.random() * 5; }
    if (blinkT >= 0) { blinkT += dt; if (blinkT > 1.4) blinkT = -1; }
    // ear twitch: brush past an ear
    feat.ears.forEach((A, e) => {
      const S_ = earState[e]; S_.cool -= dt; S_.t += dt;
      if (!pointer.active || S_.cool > 0 || sp < 3 * scale) return;
      const dx = pointer.x - A.px, dy = pointer.y - A.py;
      const along = (dx * A.ax + dy * A.ay) / A.len, across = dx * A.ay - dy * A.ax;
      if (along > 0.15 && along < 1.4 && Math.abs(across) < A.w * 1.8) {
        S_.t = 0; S_.cool = 0.9; S_.a = (across > 0 ? 1 : -1) * (0.22 + Math.random() * 0.1);
      }
    });
  }

  // ---------- scene switching ----------
  const idxEl = () => document.getElementById('idx');
  function updateNav() {
    idxEl().textContent = `${String(cur + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;
    document.getElementById('reading').textContent = scenes[cur].reading;
  }
  const AUTOPLAY = 10;                 // seconds per drawing
  let autoT = 0, navLock = 0;
  function go(d) {
    autoT = 0; navLock = 1.1;
    cur = (cur + d + scenes.length) % scenes.length;
    img = scenes[cur].im;
    const run = () => {
      for (let i = 0; i < N; i++) {             // loosen everything, then let it flow into the new pose
        const a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 5) * scale;
        vx[i] += Math.cos(a) * s; vy[i] += Math.sin(a) * s;
      }
      build();
      springGain = 0.05;
      updateNav();
    };
    img.complete ? run() : (img.onload = run);
  }

  // ---------- interaction ----------
  function setPointer(e) {
    const x = e.clientX * scale, y = e.clientY * scale;
    if (pointer.active) { pointer.vx = x - pointer.x; pointer.vy = y - pointer.y; }
    pointer.x = x; pointer.y = y; pointer.active = true;
  }
  canvas.addEventListener('pointermove', setPointer);
  canvas.addEventListener('pointerdown', e => {
    setPointer(e); pointer.down = true; pointer.downAt = performance.now();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', e => {
    // short press = burst; long drag = just sweeping
    if (performance.now() - pointer.downAt < 220) burst(pointer.x, pointer.y);
    pointer.down = false;
    if (e.pointerType !== 'mouse') pointer.active = false;
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.vx = pointer.vy = 0; });

  function burst(x, y) {
    const R = radius * scale * 2.4, R2 = R * R, power = 14 + strength * 0.5;
    for (let i = 0; i < N; i++) {
      const dx = px[i] - x, dy = py[i] - y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) + 0.01, f = (1 - d / R);
        const j = 0.6 + Math.random() * 0.8;
        vx[i] += dx / d * f * f * power * j * scale;
        vy[i] += dy / d * f * f * power * j * scale;
      }
    }
  }

  function scatter() {
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 26) * scale;
      vx[i] += Math.cos(a) * s; vy[i] += Math.sin(a) * s - 4 * scale;
    }
    springGain = 0;
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.getElementById('scatter').addEventListener('click', scatter);
  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(1));
  document.getElementById('radius').addEventListener('input', e => radius = +e.target.value);
  document.getElementById('strength').addEventListener('input', e => strength = +e.target.value);
  let dt_;
  document.getElementById('density').addEventListener('input', e => {
    densityMul = +e.target.value / 100;
    document.getElementById('densityVal').textContent = e.target.value + '%';
    clearTimeout(dt_); dt_ = setTimeout(() => build(true), 90);
  });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const map = { '1': 'repel', '2': 'vortex', '3': 'gravity', '4': 'wind' };
    if (map[e.key]) setMode(map[e.key]);
    else if (e.code === 'Space') { e.preventDefault(); scatter(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 200); });

  // ---------- simulation ----------
  function step(dt) {
    t += dt;
    springGain += (1 - springGain) * Math.min(1, dt * 0.9);
    const damp = Math.pow(0.86, dt * 60);
    const R = radius * scale, R2 = R * R;
    const S = strength / 45;
    const pa = pointer.active, mx = pointer.x, my = pointer.y;
    const pvx = Math.max(-60, Math.min(60, pointer.vx)), pvy = Math.max(-60, Math.min(60, pointer.vy));
    const sweep = pointer.down ? 0.35 : 0.08;
    const breathe = 0.35 * scale;
    const f60 = dt * 60;
    updateCute(dt);
    const hum = purr * 0.55 * scale, gentle = 1 - purr;
    const blink = blinkAmount();
    const swayAng = feat.sway.map(A => A.wag
      ? A.amp * (Math.sin(t * A.speed) * 0.8 + Math.sin(t * A.speed * 2.3 + 1.1) * 0.25)
      : A.amp * Math.sin(t * A.speed) * (0.85 + 0.15 * Math.sin(t * 0.37)));
    const earAng = earState.map(S_ => S_.t < 0.8 ? S_.a * Math.exp(-S_.t * 7) * Math.cos(S_.t * 30) : 0);

    for (let i = 0; i < N; i++) {
      let x = px[i], y = py[i];
      const ph = phase[i];
      // home with a tiny living shimmer
      let tx = hx[i] + Math.sin(t * 1.3 + ph) * breathe;
      let ty = hy[i] + Math.cos(t * 1.1 + ph * 1.7) * breathe;
      if (hum && !isWord[i]) { tx += Math.sin(t * 52 + ph * 9) * hum; ty += Math.cos(t * 47 + ph * 7) * hum; }
      const pf = part[i];
      if (pf) {
        if (pf <= 2 && blink) {
          const E = feat.eyes[pf - 1];
          // lids close onto a line through the eye, tilted to follow her head
          const d = (tx - E.x) * E.nx + (ty - E.y) * E.ny, c = d * blink * 0.9 * partW[i];
          tx -= E.nx * c; ty -= E.ny * c;
        } else if (pf >= 5) {
          const a = swayAng[pf - 5] * partW[i];
          if (a) {
            const A = feat.sway[pf - 5], dx = tx - A.px, dy = ty - A.py, c = Math.cos(a), sn = Math.sin(a);
            tx = A.px + dx * c - dy * sn; ty = A.py + dx * sn + dy * c;
          }
        } else if (pf >= 3) {
          const a = earAng[pf - 3] * partW[i];
          if (a) {
            const A = feat.ears[pf - 3], dx = tx - A.px, dy = ty - A.py, c = Math.cos(a), sn = Math.sin(a);
            tx = A.px + dx * c - dy * sn; ty = A.py + dx * sn + dy * c;
          }
        }
      }
      let ax = (tx - x) * k[i] * springGain;
      let ay = (ty - y) * k[i] * springGain;

      if (pa) {
        const dx = x - mx, dy = y - my, d2 = dx * dx + dy * dy;
        if (d2 < R2) {
          const d = Math.sqrt(d2) + 0.001;
          const fall = 1 - d / R, f = fall * fall * S * gentle;
          const nx = dx / d, ny = dy / d;
          if (mode === 'repel') {
            ax += nx * f * 6 * scale; ay += ny * f * 6 * scale;
          } else if (mode === 'vortex') {
            ax += (-ny * 5 - nx * 0.9) * f * scale; ay += (nx * 5 - ny * 0.9) * f * scale;
          } else if (mode === 'gravity') {
            const g = Math.min(1, d / (R * 0.12));
            ax -= nx * f * 5 * scale * g; ay -= ny * f * 5 * scale * g;
            ax += -ny * f * 0.8 * scale; ay += nx * f * 0.8 * scale;
          } else { // wind: pushes along a flowing noise field
            const a = Math.sin(x * 0.006 + t) + Math.cos(y * 0.005 - t * 0.7);
            ax += (Math.cos(a * 2) * 3 + 2.2) * fall * S * scale;
            ay += (Math.sin(a * 2) * 3 - 0.6) * fall * S * scale;
          }
          // the cursor drags ink along with it
          ax += pvx * fall * sweep; ay += pvy * fall * sweep;
        }
      }
      let nvx = (vx[i] + ax * f60) * damp;
      let nvy = (vy[i] + ay * f60) * damp;
      vx[i] = nvx; vy[i] = nvy;
      px[i] = x + nvx * f60; py[i] = y + nvy * f60;
    }
    pointer.vx *= 0.6; pointer.vy *= 0.6;
  }

  // ---------- render ----------
  function render() {
    buf32.fill((255 << 24) | (PAPER[2] << 16) | (PAPER[1] << 8) | PAPER[0]);
    for (let i = 0; i < N; i++) {
      const x = px[i] | 0, y = py[i] | 0;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const j = (y * W + x) << 2;
      const sp = Math.min(1, Math.hypot(vx[i], vy[i]) / (10 * scale));
      const a = 0.32 + ink[i] * 0.7;
      // ink: subtract; fast particles bleed toward a rust red
      buf8[j]     -= a * (205 - sp * 40);
      buf8[j + 1] -= a * (210 + sp * 25);
      buf8[j + 2] -= a * (205 + sp * 40);
    }
    // hearts, in the same ink, fading as they rise
    for (const h of hearts) {
      const fadeIn = Math.min(1, h.life / 0.25), fadeOut = Math.min(1, (h.max - h.life) / 0.8);
      const a = 0.95 * fadeIn * fadeOut, grow = 0.75 + Math.min(1, h.life / 0.5) * 0.25;
      for (let p = 0; p < h.pts.length; p += 2) {
        const x = (h.x + h.pts[p] * grow) | 0, y = (h.y + h.pts[p + 1] * grow) | 0;
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const j = (y * W + x) << 2;
        buf8[j] -= a * 165; buf8[j + 1] -= a * 210; buf8[j + 2] -= a * 205;
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  const stat = document.getElementById('stat');
  const progEl = document.getElementById('prog');
  // scroll / swipe to move through the series
  let wheelAcc = 0, wheelT = 0;
  addEventListener('wheel', e => {
    e.preventDefault();
    if (navLock > 0) return;
    const now = performance.now(); if (now - wheelT > 250) wheelAcc = 0; wheelT = now;
    wheelAcc += Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(wheelAcc) > 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; }
  }, { passive: false });
  let sw = null;
  canvas.addEventListener('touchstart', e => { if (e.touches.length === 1) sw = { y: e.touches[0].clientY, t: performance.now() }; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!sw) return;
    const dy = e.changedTouches[0].clientY - sw.y, dtm = performance.now() - sw.t; sw = null;
    if (navLock <= 0 && Math.abs(dy) > 90 && dtm < 450) go(dy < 0 ? 1 : -1);   // quick flick up/down
  }, { passive: true });
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    fps += ((1 / Math.max(dt, 0.001)) - fps) * 0.05;
    step(dt);
    render();
    // autoplay: holds while you're petting her or dragging
    navLock = Math.max(0, navLock - dt);
    if (!(pointer.down || stillT > 0.3)) autoT += dt;
    if (autoT >= AUTOPLAY) go(1);
    progEl.style.transform = `scaleX(${Math.min(1, autoT / AUTOPLAY)})`;
    requestAnimationFrame(frame);
  }

  scenes[0].im.onload = async () => {
    try {
      await Promise.race([
        Promise.all([document.fonts.load('900 100px "WordFace"', '希望愛'), document.fonts.load('900 100px "Noto Sans JP"', '希望愛')]),
        new Promise(r => setTimeout(r, 2500))
      ]);
    } catch (e) {}
    build(); updateNav();
    document.getElementById('loading').style.opacity = 0;
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
  };
})();
</script>
</body>
</html>
