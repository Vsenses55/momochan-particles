<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>希望 · 愛 — Cat Particle Study</title>
<meta name="description" content="An interactive particle study: ink drawings of a cat, each paired with a kanji for what she's feeling.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"WordFace";font-weight:100 900;src:local("Kozuka Gothic Pr6N H"),local("KozGoPr6N-Heavy"),local("Kozuka Gothic Pr6N B"),local("KozGoPr6N-Bold"),local("Kozuka Gothic Pr6N");}
  :root{
    --bg:#f3efe7; --fg:#1d1b18; --muted:#8a8378; --line:rgba(29,27,24,.14); --chip:rgba(255,255,255,.55); --accent:#b4471f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);transition:background .5s,color .5s}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  .title{position:fixed;top:28px;left:32px;pointer-events:none;max-width:320px}
  .title h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:44px;line-height:.95;margin:0;letter-spacing:-.01em}
  .title h1 em{color:var(--accent)}
  .title p{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 0;line-height:1.7}
  .panel{position:fixed;left:32px;bottom:28px;display:flex;flex-direction:column;gap:14px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .label{color:var(--muted);width:64px}
  button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);padding:7px 11px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);transition:all .2s}
  button:hover{border-color:var(--fg)}
  button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  button kbd{font:inherit;opacity:.5;margin-left:6px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:1px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--fg);cursor:pointer}
  .stat{position:fixed;right:32px;bottom:28px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:right;line-height:1.7;pointer-events:none}
  .nav{position:fixed;top:28px;right:32px;display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .nav #idx{color:var(--fg);min-width:52px;text-align:center}
  .nav .reading{color:var(--muted);margin-right:10px;text-transform:none;letter-spacing:.04em}
  .nav button{width:34px;height:34px;padding:0;font-size:14px;display:grid;place-items:center}
  .loading{position:fixed;inset:0;display:grid;place-items:center;font-family:"Instrument Serif",serif;font-style:italic;font-size:28px;color:var(--muted);pointer-events:none;transition:opacity .6s}
  @media (max-width:700px){
    .title{top:18px;left:18px}.title h1{font-size:32px}.title p{display:none}
    .panel{left:14px;right:14px;bottom:14px;gap:10px}.label{width:auto;margin-right:4px}
    .nav{top:14px;right:14px} .stat{display:none} input[type=range]{width:110px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">gathering ink…</div>

<div class="panel">
  <div class="row"><span class="label">Force</span>
    <button data-mode="repel" class="on">Repel<kbd>1</kbd></button>
    <button data-mode="vortex">Vortex<kbd>2</kbd></button>
    <button data-mode="gravity">Gravity<kbd>3</kbd></button>
    <button data-mode="wind">Wind<kbd>4</kbd></button>
  </div>
  <div class="row"><span class="label">Radius</span><input id="radius" type="range" min="40" max="320" value="130"></div>
  <div class="row"><span class="label">Strength</span><input id="strength" type="range" min="1" max="100" value="45"></div>
  <div class="row"><span class="label">Do</span>
    <button id="scatter">Scatter<kbd>space</kbd></button>
  </div>
</div>

<div class="nav">
  <span class="reading" id="reading"></span>
  <button id="prev" aria-label="Previous">←</button>
  <span id="idx">01 / 02</span>
  <button id="next" aria-label="Next">→</button>
</div>
<div class="stat" id="stat"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // ---------- the series ----------
  const scenes = [
    { src: 'assets/cat-01.jpg', glyphs: ['希', '望'], reading: 'kibō · hope', gamma: 0.85, density: 1,   glyphSize: 0.27, glyphY: 0.5 },
    { src: 'assets/cat-02.jpg', glyphs: ['愛'],       reading: 'ai · love',  gamma: 1.5,  density: 1.7, glyphSize: 0.36, glyphY: 0.4 },
  ];
  scenes.forEach(sc => { sc.im = new Image(); sc.im.src = sc.src; });
  let cur = 0, img = scenes[0].im;

  // ---------- state ----------
  let W = 0, H = 0, scale = 1;              // device pixel buffer size
  let N = 0;
  let px, py, vx, vy, hx, hy, ink, phase, k, isWord; // particle arrays
  let imageData, buf32, buf8;
  let mode = 'repel', night = false;
  let radius = 130, strength = 45;
  let springGain = 1;                         // ramps after scatter
  const pointer = { x: -9999, y: -9999, px: -9999, py: -9999, vx: 0, vy: 0, active: false, down: false };
  let t = 0, last = performance.now(), fps = 60;

  const PAPER = [243, 239, 231];
  const NIGHT = [12, 12, 16];

  // ---------- build particles from image ----------
  function build() {
    const cssW = innerWidth, cssH = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    scale = Math.min(dpr, Math.sqrt(3.2e6 / (cssW * cssH)));
    W = Math.max(1, Math.floor(cssW * scale));
    H = Math.max(1, Math.floor(cssH * scale));
    canvas.width = W; canvas.height = H;
    imageData = ctx.createImageData(W, H);
    buf8 = imageData.data;
    buf32 = new Uint32Array(buf8.buffer);

    // Fit cat: tall on desktop, offset right of the UI; centered on mobile
    const ar = img.width / img.height;
    const narrow = cssW < 700;
    const KW = 0.3;                       // kanji column width as a share of cat height
    let dh, dw, ox, oy;
    if (narrow) {
      // phone: cat + kanji side by side, sitting above the controls
      const availH = H - 200 * scale - 24 * scale;
      dh = Math.min(availH * 0.95, (W * 0.94) / (ar + KW));
      dw = dh * ar;
      ox = (W - (dw + dh * KW)) / 2 + dh * KW;
      oy = 24 * scale + (availH - dh) / 2;
    } else {
      dh = H * 0.9; dw = dh * ar;
      if (dw > W * 0.92) { dw = W * 0.92; dh = dw / ar; }
      ox = Math.max((W - dw) / 2, W * 0.5 - dw * 0.42);
      oy = (H - dh) / 2;
    }

    // sample at device resolution
    const sw = Math.round(dw), sh = Math.round(dh);
    const off = document.createElement('canvas');
    off.width = sw; off.height = sh;
    const octx = off.getContext('2d', { willReadFrequently: true });
    octx.drawImage(img, 0, 0, sw, sh);
    const src = octx.getImageData(0, 0, sw, sh).data;

    // weight = darkness^gamma; choose density to hit a target count
    const target = Math.round(Math.min(150000, Math.max(36000, (W * H) / 24 * scenes[cur].density)));
    const weights = new Float32Array(sw * sh);
    let sum = 0;
    for (let i = 0, j = 0; i < weights.length; i++, j += 4) {
      const lum = (src[j] * 0.299 + src[j + 1] * 0.587 + src[j + 2] * 0.114) / 255;
      let d = Math.max(0, (0.93 - lum) / 0.93);   // paper → 0
      d = Math.pow(d, scenes[cur].gamma);
      weights[i] = d; sum += d;
    }
    const prob = Math.min(2.5, target / sum);
    const tx = [], ty = [], ti = [];
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const w = weights[y * sw + x];
        if (w > 0.02) {
          // dark fur can take more than one particle per pixel
          const want = w * prob; let n = want | 0; if (Math.random() < want - n) n++;
          for (let q = 0; q < n; q++) {
            tx.push(ox + x + Math.random() - 0.5);
            ty.push(oy + y + Math.random() - 0.5);
            ti.push(w);
          }
        }
      }
    }
    const catCount = tx.length;

    // ---- the word, set over her in the same ink ----
    const glyphs = scenes[cur].glyphs;
    const fam = '"WordFace", "Kozuka Gothic Pr6N", "Noto Sans JP", sans-serif';
    const tc = document.createElement('canvas'); tc.width = W; tc.height = H;
    const tctx = tc.getContext('2d', { willReadFrequently: true });
    // set vertically (tategaki), two tall glyphs crossing her left flank
    const fs = Math.min(dh * scenes[cur].glyphSize, W * 0.25 * (narrow ? 1.3 : 1));
    tctx.font = `900 ${fs}px ${fam}`;
    tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
    const cy = oy + dh * scenes[cur].glyphY;
    const drawGlyphs = (x) => {
      tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H);
      const step = fs * 1.06, top = cy - step * (glyphs.length - 1) / 2;
      glyphs.forEach((g, n) => tctx.fillText(g, x, top + n * step));
    };
    let cx = ox - dw * 0.4;
    {
      // measure row by row: glyph right edge vs her leftmost fur, then snug up
      drawGlyphs(cx);
      const g = tctx.getImageData(0, 0, W, H).data;
      const gap = 10 * scale, run = Math.max(6, Math.round(7 * scale));
      let minGap = Infinity;
      for (let y = 0; y < H; y++) {
        let gr = -1;
        for (let x = W - 1; x >= 0; x--) if (g[(y * W + x) * 4 + 3] > 40) { gr = x; break; }
        if (gr < 0) continue;
        const iy = Math.round(y - oy);
        if (iy < 0 || iy >= sh) continue;
        let cl = Infinity;
        // her body edge = first solid run of fur (skips the wispy tail strokes)
        let cnt = 0;
        for (let ix = 0; ix < sw; ix++) {
          const w = weights[iy * sw + ix];
          if (w > 0.14) { if (++cnt >= run) { cl = ox + ix - run + 1; break; } } else cnt = Math.max(0, cnt - 1);
        }
        if (cl < Infinity) minGap = Math.min(minGap, cl - gr);
      }
      if (minGap < Infinity) cx += minGap - gap;
      cx = Math.max(fs * 0.55, cx);
    }
    drawGlyphs(cx);
    const td = tctx.getImageData(0, 0, W, H).data;
    let area = 0;
    for (let j = 3; j < td.length; j += 16) if (td[j] > 128) area++;
    area *= 4;
    const tp = Math.min(0.6, (target / scenes[cur].density * 0.3) / Math.max(1, area));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const al = td[(y * W + x) * 4 + 3] / 255;
      // occlusion: the word thins out behind her fur so she sits in front of it
      const ix = Math.round(x - ox), iy = Math.round(y - oy);
      const occ = (ix >= 0 && iy >= 0 && ix < sw && iy < sh) ? Math.min(1, weights[iy * sw + ix] * 1.6) : 0;
      if (al > 0.3 && Math.random() < tp * al * (1 - occ * 0.82)) {
        tx.push(x + Math.random() - 0.5); ty.push(y + Math.random() - 0.5); ti.push(0.75);
      }
    }

    const prevN = N, opx = px, opy = py;
    N = tx.length;
    px = new Float32Array(N); py = new Float32Array(N);
    vx = new Float32Array(N); vy = new Float32Array(N);
    hx = new Float32Array(tx); hy = new Float32Array(ty);
    ink = new Float32Array(ti);
    isWord = new Uint8Array(N); isWord.fill(1, catCount);
    phase = new Float32Array(N); k = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      phase[i] = Math.random() * Math.PI * 2;
      k[i] = 0.018 + Math.random() * 0.03;     // per-particle spring → organic reform
      if (prevN && i < prevN) { px[i] = opx[i]; py[i] = opy[i]; }
      else if (prevN) {
        // extra particles peel off the previous image
        const j = (Math.random() * prevN) | 0;
        px[i] = opx[j] + (Math.random() - 0.5) * 6; py[i] = opy[j] + (Math.random() - 0.5) * 6;
      } else {
        // intro: drift in from a loose cloud
        const a = Math.random() * Math.PI * 2, r = (0.35 + Math.random() * 0.8) * Math.max(W, H) * 0.6;
        px[i] = W / 2 + Math.cos(a) * r; py[i] = H / 2 + Math.sin(a) * r;
      }
    }
    if (!prevN) springGain = 0.08;
      }

  // ---------- scene switching ----------
  const idxEl = () => document.getElementById('idx');
  function updateNav() {
    idxEl().textContent = `${String(cur + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;
    document.getElementById('reading').textContent = scenes[cur].reading;
  }
  function go(d) {
    cur = (cur + d + scenes.length) % scenes.length;
    img = scenes[cur].im;
    const run = () => {
      for (let i = 0; i < N; i++) {             // loosen everything, then let it flow into the new pose
        const a = Math.random() * Math.PI * 2, s = (1 + Math.random() * 5) * scale;
        vx[i] += Math.cos(a) * s; vy[i] += Math.sin(a) * s;
      }
      build();
      springGain = 0.05;
      updateNav();
    };
    img.complete ? run() : (img.onload = run);
  }

  // ---------- interaction ----------
  function setPointer(e) {
    const x = e.clientX * scale, y = e.clientY * scale;
    if (pointer.active) { pointer.vx = x - pointer.x; pointer.vy = y - pointer.y; }
    pointer.x = x; pointer.y = y; pointer.active = true;
  }
  canvas.addEventListener('pointermove', setPointer);
  canvas.addEventListener('pointerdown', e => {
    setPointer(e); pointer.down = true; pointer.downAt = performance.now();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', e => {
    // short press = burst; long drag = just sweeping
    if (performance.now() - pointer.downAt < 220) burst(pointer.x, pointer.y);
    pointer.down = false;
    if (e.pointerType !== 'mouse') pointer.active = false;
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; pointer.vx = pointer.vy = 0; });

  function burst(x, y) {
    const R = radius * scale * 2.4, R2 = R * R, power = 14 + strength * 0.5;
    for (let i = 0; i < N; i++) {
      const dx = px[i] - x, dy = py[i] - y, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) + 0.01, f = (1 - d / R);
        const j = 0.6 + Math.random() * 0.8;
        vx[i] += dx / d * f * f * power * j * scale;
        vy[i] += dy / d * f * f * power * j * scale;
      }
    }
  }

  function scatter() {
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, s = (4 + Math.random() * 26) * scale;
      vx[i] += Math.cos(a) * s; vy[i] += Math.sin(a) * s - 4 * scale;
    }
    springGain = 0;
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.getElementById('scatter').addEventListener('click', scatter);
  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(1));
  document.getElementById('radius').addEventListener('input', e => radius = +e.target.value);
  document.getElementById('strength').addEventListener('input', e => strength = +e.target.value);
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const map = { '1': 'repel', '2': 'vortex', '3': 'gravity', '4': 'wind' };
    if (map[e.key]) setMode(map[e.key]);
    else if (e.code === 'Space') { e.preventDefault(); scatter(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 200); });

  // ---------- simulation ----------
  function step(dt) {
    t += dt;
    springGain += (1 - springGain) * Math.min(1, dt * 0.9);
    const damp = Math.pow(0.86, dt * 60);
    const R = radius * scale, R2 = R * R;
    const S = strength / 45;
    const pa = pointer.active, mx = pointer.x, my = pointer.y;
    const pvx = Math.max(-60, Math.min(60, pointer.vx)), pvy = Math.max(-60, Math.min(60, pointer.vy));
    const sweep = pointer.down ? 0.35 : 0.08;
    const breathe = 0.35 * scale;
    const f60 = dt * 60;

    for (let i = 0; i < N; i++) {
      let x = px[i], y = py[i];
      const ph = phase[i];
      // home with a tiny living shimmer
      const tx = hx[i] + Math.sin(t * 1.3 + ph) * breathe;
      const ty = hy[i] + Math.cos(t * 1.1 + ph * 1.7) * breathe;
      let ax = (tx - x) * k[i] * springGain;
      let ay = (ty - y) * k[i] * springGain;

      if (pa) {
        const dx = x - mx, dy = y - my, d2 = dx * dx + dy * dy;
        if (d2 < R2) {
          const d = Math.sqrt(d2) + 0.001;
          const fall = 1 - d / R, f = fall * fall * S;
          const nx = dx / d, ny = dy / d;
          if (mode === 'repel') {
            ax += nx * f * 6 * scale; ay += ny * f * 6 * scale;
          } else if (mode === 'vortex') {
            ax += (-ny * 5 - nx * 0.9) * f * scale; ay += (nx * 5 - ny * 0.9) * f * scale;
          } else if (mode === 'gravity') {
            const g = Math.min(1, d / (R * 0.12));
            ax -= nx * f * 5 * scale * g; ay -= ny * f * 5 * scale * g;
            ax += -ny * f * 0.8 * scale; ay += nx * f * 0.8 * scale;
          } else { // wind: pushes along a flowing noise field
            const a = Math.sin(x * 0.006 + t) + Math.cos(y * 0.005 - t * 0.7);
            ax += (Math.cos(a * 2) * 3 + 2.2) * fall * S * scale;
            ay += (Math.sin(a * 2) * 3 - 0.6) * fall * S * scale;
          }
          // the cursor drags ink along with it
          ax += pvx * fall * sweep; ay += pvy * fall * sweep;
        }
      }
      let nvx = (vx[i] + ax * f60) * damp;
      let nvy = (vy[i] + ay * f60) * damp;
      vx[i] = nvx; vy[i] = nvy;
      px[i] = x + nvx * f60; py[i] = y + nvy * f60;
    }
    pointer.vx *= 0.6; pointer.vy *= 0.6;
  }

  // ---------- render ----------
  function render() {
    const bg = night ? NIGHT : PAPER;
    if (night) {
      // fade toward background → soft light trails
      for (let j = 0; j < buf8.length; j += 4) {
        buf8[j]     = buf8[j]     + (bg[0] - buf8[j])     * 0.22;
        buf8[j + 1] = buf8[j + 1] + (bg[1] - buf8[j + 1]) * 0.22;
        buf8[j + 2] = buf8[j + 2] + (bg[2] - buf8[j + 2]) * 0.22;
        buf8[j + 3] = 255;
      }
    } else {
      buf32.fill((255 << 24) | (bg[2] << 16) | (bg[1] << 8) | bg[0]);
    }

    for (let i = 0; i < N; i++) {
      const x = px[i] | 0, y = py[i] | 0;
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const j = (y * W + x) << 2;
      const sp = Math.min(1, Math.abs(vx[i]) + Math.abs(vy[i]) > 0 ? Math.hypot(vx[i], vy[i]) / (10 * scale) : 0);
      const a = 0.32 + ink[i] * 0.7;
      if (false) {
        if (!night) { buf8[j] -= a * (50 - sp * 20); buf8[j + 1] -= a * (150 - sp * 30); buf8[j + 2] -= a * (175 - sp * 40); }
        else { const b = a * 0.5; buf8[j] += b * 255; buf8[j + 1] += b * (78 + sp * 130); buf8[j + 2] += b * (34 + sp * 190); }
      } else if (!night) {
        // ink: subtract; fast particles bleed toward a rust red
        buf8[j]     -= a * (205 - sp * 40);
        buf8[j + 1] -= a * (210 + sp * 25);
        buf8[j + 2] -= a * (205 + sp * 40);
      } else {
        // light: add; warm amber at rest, cool white-blue when moving
        const b = a * 0.75;
        buf8[j]     += b * (255 - sp * 110);
        buf8[j + 1] += b * (170 + sp * 50);
        buf8[j + 2] += b * (95 + sp * 160);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  const stat = document.getElementById('stat');
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    fps += ((1 / Math.max(dt, 0.001)) - fps) * 0.05;
    step(dt);
    render();
    if ((now | 0) % 15 === 0) stat.innerHTML = `${mode} · r ${radius} · s ${strength}<br>${N.toLocaleString()} particles · ${Math.round(fps)} fps`;
    requestAnimationFrame(frame);
  }

  scenes[0].im.onload = async () => {
    try {
      await Promise.race([
        Promise.all([document.fonts.load('900 100px "WordFace"', '希望愛'), document.fonts.load('900 100px "Noto Sans JP"', '希望愛')]),
        new Promise(r => setTimeout(r, 2500))
      ]);
    } catch (e) {}
    build(); updateNav();
    document.getElementById('loading').style.opacity = 0;
    requestAnimationFrame(t0 => { last = t0; frame(t0); });
  };
})();
</script>
</body>
</html>
